name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: Linux-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: Linux-nuget-

      - name: Build & Test
        run: dotnet test Eidet.slnx -c Release

  # Self-contained binaries for Docker and non-.NET users
  build-binaries:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: eidet-win-x64.exe
          - os: macos-latest
            rid: osx-arm64
            artifact: eidet-osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: eidet-linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Validate version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CODE_VERSION=$(sed -n 's/.*Current = "\([^"]*\)".*/\1/p' src/Eidet.Core/EidetVersion.cs)
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match EidetVersion.Current ($CODE_VERSION)"
            exit 1
          fi

      - name: Publish
        run: >
          dotnet publish src/Eidet.Service/Eidet.Service.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish

      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            mv ./publish/Eidet.Service.exe ./publish/${{ matrix.artifact }}
          else
            mv ./publish/Eidet.Service ./publish/${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ./publish/${{ matrix.artifact }}

  create-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            LOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Eidet ${{ github.ref_name }}
          body: |
            ## Install / Update

            ```bash
            # First install
            dotnet tool install -g eidet
            eidet install

            # Update existing
            eidet update
            ```

            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Standalone binaries

            For environments without the .NET SDK (Docker, CI), download the self-contained binary for your platform below.
          files: |
            artifacts/eidet-win-x64.exe/eidet-win-x64.exe
            artifacts/eidet-osx-arm64/eidet-osx-arm64
            artifacts/eidet-linux-x64/eidet-linux-x64
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Publish eidet dotnet tool + Eidet.Sdk library to NuGet (OIDC trusted publishing)
  publish-nuget:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Pack dotnet tool
        run: >
          dotnet pack src/Eidet.Service/Eidet.Service.csproj
          -c Release
          -p:Version=${{ steps.version.outputs.VERSION }}
          -o ./nupkg

      - name: Pack SDK library
        run: >
          dotnet pack sdk/dotnet/Eidet.Sdk/Eidet.Sdk.csproj
          -c Release
          -p:Version=${{ steps.version.outputs.VERSION }}
          -o ./nupkg

      - name: Pack Anthropic memory-tool adapter
        run: >
          dotnet pack sdk/dotnet/Eidet.Sdk.Anthropic/Eidet.Sdk.Anthropic.csproj
          -c Release
          -p:Version=${{ steps.version.outputs.VERSION }}
          -o ./nupkg

      - name: NuGet login (OIDC)
        uses: nuget/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push ./nupkg/*.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # Publish @eidet/sdk to npm (OIDC trusted publishing — no token needed)
  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish
        working-directory: sdk/typescript
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version $VERSION --no-git-tag-version --allow-same-version
          npm ci
          npm run build

          # Check if this version already exists (safe re-run)
          if npm view @eidet/sdk@$VERSION version 2>/dev/null; then
            echo "Version $VERSION already published — skipping"
          else
            npm publish --access public
          fi

  # Publish eidet-sdk to PyPI (trusted publishing via OIDC)
  publish-pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build package
        working-directory: sdk/python
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          pip install build
          python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          skip-existing: true

  # Build and push Docker image to Docker Hub + GHCR
  publish-docker:
    needs: test
    runs-on: ubuntu-latest
    environment: docker
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            eidet/eidet
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
